aid: skyslope
name: SkySlope
review:
  question: Does SkySlope expose a documented public WebSocket API?
  answer: false
  date: '2026-07-04'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. SkySlope's documented public API surface
    (the Partnership / Forms API and the Offers API) is request/response REST
    over HTTPS. The only push-style mechanism found is a signed-documents
    webhook on the Partnership API (POST /documents/sign/subscribe/{fileId}),
    which delivers events by HTTP callback to a subscriber URL - not a
    server-push WebSocket transport. There is no ws:// or wss:// endpoint
    documented on any SkySlope API to model.
findings:
  summary: |
    SkySlope does not publish a documented public WebSocket API. SkySlope is a
    real estate transaction management and digital forms platform. Its public,
    partner-oriented APIs are REST over HTTPS: the Partnership / Forms API
    (base https://forms.skyslope.com/partner/api, OAuth 2.0 authorization-code
    flow with PKCE via accounts.skyslope.com, scope forms.files) and the Offers
    API (base https://offers.skyslope.com/offers-api, OAuth 2.0
    client-credentials flow). A broader Transaction Management API (BETA) is
    referenced on api.skyslope.com; that host is live and returns 401 without a
    token, but a complete public reference was not reachable at review time.
    The only near-real-time mechanism is the Partnership API signed-documents
    webhook (HTTP callback), not a WebSocket. No realtime, bidirectional, or
    streaming WebSocket endpoint is documented on any SkySlope API.
  accessModel: |
    API access is partner/brokerage-gated. The Partnership / Forms API and
    Offers API reference documentation is public (rendered with Redoc), but
    obtaining OAuth client credentials requires working with SkySlope as a
    partner/brokerage. Some Partnership API endpoints are explicitly marked in
    the reference as partner-only / coming soon.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://forms.skyslope.com/partner/api
      documented: true
      note: Partnership / Forms API. Staging and integ hosts also documented.
    - protocol: REST
      scheme: https
      baseURL: https://offers.skyslope.com/offers-api
      documented: true
      note: Offers API. Staging host also documented.
    - protocol: REST
      scheme: https
      baseURL: https://api.skyslope.com/api
      documented: partial
      note: Transaction Management API (BETA). Host live (401 without auth); full public reference not reachable at review time.
    - protocol: Webhook
      scheme: https
      documented: true
      note: Signed-documents webhook on the Partnership API (POST /documents/sign/subscribe/{fileId}). HTTP callback, not WebSocket.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented on any SkySlope API as of the review date.
