actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. SkySlope's documented public APIs
    (Partnership / Forms API and Offers API) are request/response REST over
    HTTPS, and the only push mechanism is an HTTP callback webhook for signed
    documents. No AsyncAPI document was created because there is no server-push
    WebSocket or SSE transport on any SkySlope API to model.
