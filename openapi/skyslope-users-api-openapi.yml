  /groups/{groupId}/child:
    post:
      summary: Add Child Group
      tags:
      - Users
      description: 'Create a new child group for a parent group via accounts-api.

        REQUIRED SCOPES:


        admin.groups'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  minLength: 1
                  description: The name of the child group.
        required: true
      parameters:
      - schema:
          type: string
          minLength: 1
        in: path
        name: groupId
        required: true
        description: The id of the parent group.
      responses:
        '200':
          description: Child group already exists for the parent group.
          content:
            application/json:
              schema:
                type: object
                properties:
                  childGroupId:
                    type: string
                    description: The id of the newly created child group.
                required:
                - childGroupId
        '201':
          description: Child group successfully created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  childGroupId:
                    type: string
                    description: The id of the newly created child group.
                required:
                - childGroupId
        '400':
          description: An object containing the error that occurred.
          content:
            application/json:
              schema:
