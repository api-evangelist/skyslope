tags:
- name: Users
paths:
  /users/profile:
    get:
      summary: Get User Profile
      tags:
      - Users
      description: Retrieve the user profile of the currently authenticated user
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The id of the user who belongs to the profile.
                  subscriberId:
                    type: string
                    description: The subscriber id of the user.
                  firstName:
                    type: string
                    description: The first name of the user.
                  middleName:
                    type: string
                    description: The middle name of the user.
                  lastName:
                    type: string
                    description: The last name of the user.
                  suffix:
                    type: string
                    description: The suffix of the user.
                  email:
                    type: string
                    description: The email of the user.
                  primaryPhoneNumber:
                    type: string
                    description: The primary phone number of the user.
                  brokerageName:
                    type: string
                    description: The name of the brokerage that the user belongs to.
                  brokerageAddress:
                    type: object
                    description: The address of the brokerage that the user belongs to.
                    properties:
                      streetAddress:
                        type: string
                        description: The street address of the brokerage.
                      unitNumber:
                        type: string
                        description: The unit number of the brokerage.
                      city:
                        type: string
                        description: The city of the brokerage.
                      state:
                        type: string
                        description: The state of the brokerage.
                      postalCode:
                        type: string
                        description: The postal code of the brokerage.
                      county:
                        type: string
                        description: The county of the brokerage.
                  brokeragePhone:
                    type: string
                    description: The phone number of the brokerage that the user belongs to.
                  brokerageFax:
                    type: string
                    description: The fax number of the brokerage that the user belongs to.
                  regions:
                    type: array
                    description: An array of regions that the user has access to.
                    items:
                      type: object
                      properties:
                        country:
                          type: string
                        region:
                          type: string
                  libraries:
                    type: array
                    description: An array of libraries that the user has access to.
                    items:
                      type: number
                  authProfiles:
                    type: array
                    description: An array of the auth profiles of the user.
                    items:
                      additionalFields: true
                  isInitialized:
                    type: boolean
                    description: Evaluates to true if the user profile has been on-boarded.
                  termAcceptanceDate:
                    type: string
                    description: The date and time the user accepted the terms.
                  mlsCode:
                    type: string
                    description: The mls code of the user.
                  licenseNumber:
                    type: string
                    description: The license number of the user.
                  brokerageLicenseNumber:
                    type: string
                    description: The license number of the brokerage that the user belongs to.
                  brokerageMLSCode:
                    type: string
                    description: The mls code of the brokerage that the user belongs to.
                  isAutoDeletePreDraftEnvelopeAllowed:
                    type: boolean
                    description: Evaluates to true if auto delete pre draft envelopes is enabled.
                  isAutoDeleteFormAllowed:
                    type: boolean
                    description: Evaluates to true if auto delete forms is enabled.
                  consentedAssociations:
                    type: array
                    description: An array of the consented associations for the user.
                    items:
                      type: string
                  userPreferences:
                    type: object
                    properties:
                      digitalSigningPlatformPreference:
                        type: string
                        description: The digital signing platform preference of the user.
                      nhdProviderPreference:
                        type: string
                        description: The nhd provider preference of the user.
                  location:
                    type: string
                    description: The location of the user.
                  createdOn:
                    type: string
                    description: The date and time the user profile was created.
                  createdBy:
                    type: string
                    description: The id of the user who created the user profile.
                  updatedOn:
                    type: string
                    description: The date and time the user profile was last updated.
                  updatedBy:
                    type: string
                    description: The id of the user who last updated the user profile.
        default:
          description: An object containing the error that occurred.
          content:
            application/json:
              schema:
                type: object
                description: An object containing the error that occurred.
                properties:
                  code:
                    type: string
                    description: A code that represents the error that occurred.
                  message:
                    type: string
                    description: A description of the error that occurred.
                  errors:
                    type: array
                    description: An array of the errors that occurred.
                    items:
                      type: string
                  traceId:
                    type: string
                    description: A request correlation ID.
      operationId: getUsersProfile
      x-operation-id-source: derived
  /group:
    post:
      summary: Add Group
      tags:
      - Users
      description: 'Create a new group via accounts-api.

        REQUIRED SCOPES:


        admin.groups'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                brokerageId:
                  type: string
                  description: The brokerage id for the new group. If not provided, will be auto-generated with prefix "partnerApi_".
                brokerageName:
                  type: string
                  description: The name of the brokerage.
      responses:
        '200':
          description: Group already exists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  groupId:
                    type: string
                    description: The id of the newly created group.
                required:
                - groupId
        '201':
          description: Group successfully created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  groupId:
                    type: string
                    description: The id of the newly created group.
                required:
                - groupId
        '400':
          description: An object containing the error that occurred.
          content:
            application/json:
              schema:
                type: object
                description: An object containing the error that occurred.
                properties:
                  code:
                    type: string
                    description: A code that represents the error that occurred.
                  message:
                    type: string
                    description: A description of the error that occurred.
                  errors:
                    type: array
                    description: An array of the errors that occurred.
                    items:
                      type: string
                  traceId:
                    type: string
                    description: A request correlation ID.
        '401':
          description: An object containing the error that occurred.
          content:
            application/json:
              schema:
                type: object
                description: An object containing the error that occurred.
                properties:
                  code:
                    type: string
                    description: A code that represents the error that occurred.
                  message:
                    type: string
                    description: A description of the error that occurred.
                  errors:
                    type: array
                    description: An array of the errors that occurred.
                    items:
                      type: string
                  traceId:
                    type: string
                    description: A request correlation ID.
        '500':
          description: An object containing the error that occurred.
          content:
            application/json:
              schema:
                type: object
                description: An object containing the error that occurred.
                properties:
                  code:
                    type: string
                    description: A code that represents the error that occurred.
                  message:
                    type: string
                    description: A description of the error that occurred.
                  errors:
                    type: array
                    description: An array of the errors that occurred.
                    items:
                      type: string
                  traceId:
                    type: string
                    description: A request correlation ID.
        default:
          description: An object containing the error that occurred.
          content:
            application/json:
              schema:
                type: object
                description: An object containing the error that occurred.
                properties:
                  code:
                    type: string
                    description: A code that represents the error that occurred.
                  message:
                    type: string
                    description: A description of the error that occurred.
                  errors:
                    type: array
                    description: An array of the errors that occurred.
                    items:
