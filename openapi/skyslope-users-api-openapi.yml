                    description: A request correlation ID.
      operationId: postGroupsByGroupIdChild
      x-operation-id-source: derived
  /users/{userId}/groups/{groupId}:
    post:
      summary: Add Group to User
      tags:
      - Users
      description: 'Add group to a user.

        REQUIRED SCOPES:


        admin.groups'
      parameters:
      - schema:
          type: string
          minLength: 1
        in: path
        name: userId
        required: true
        description: The id of the user to add to the group.
      - schema:
          type: string
          minLength: 1
        in: path
        name: groupId
        required: true
        description: The id of the group to add the user to.
      responses:
        '204':
          description: Group successfully added to user.
        default:
          description: An object containing the error that occurred.
          content:
            application/json:
              schema:
                type: object
                description: An object containing the error that occurred.
                properties:
                  code:
                    type: string
                    description: A code that represents the error that occurred.
                  message:
                    type: string
                    description: A description of the error that occurred.
                  errors:
                    type: array
                    description: An array of the errors that occurred.
                    items:
                      type: string
                  traceId:
                    type: string
                    description: A request correlation ID.
      operationId: postUsersByUserIdGroupsByGroupId
      x-operation-id-source: derived
    delete:
      summary: Remove User from Group
      tags:
      - Users
      description: 'Remove a user from a group.

        REQUIRED SCOPES:


        admin.groups'
      parameters:
      - schema:
          type: string
          minLength: 1
        in: path
        name: userId
        required: true
        description: The id of the user to remove from the group.
      - schema:
          type: string
          minLength: 1
        in: path
        name: groupId
        required: true
        description: The id of the group to remove the user from.
      responses:
        '204':
          description: User successfully removed from group.
        default:
          description: An object containing the error that occurred.
          content:
            application/json:
              schema:
                type: object
                description: An object containing the error that occurred.
                properties:
                  code:
                    type: string
                    description: A code that represents the error that occurred.
                  message:
                    type: string
                    description: A description of the error that occurred.
                  errors:
                    type: array
                    description: An array of the errors that occurred.
                    items:
                      type: string
                  traceId:
                    type: string
                    description: A request correlation ID.
      operationId: deleteUsersByUserIdGroupsByGroupId
      x-operation-id-source: derived
