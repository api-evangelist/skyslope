        Returns a single PDF if one document ID is provided, or a ZIP file containing multiple documents
        if more than one document ID is provided. The Content-Type header will reflect the appropriate
        file type.<div style="color: rgba(38, 50, 56, 0.5); border-bottom: 1px solid rgba(38, 50, 56,
        0.3); padding-bottom: 1px;">REQUIRED SCOPES:</div><div style="display: inline-flex; gap: 5px;
        padding: 5px;"><div style="border-radius: 2px; border: 1px solid rgba(128,128,255,0.5); background-color:
        rgba(64,64,255,0.25); padding: 0px 5px;">forms.documents.read</div></div>'
      parameters:
      - schema:
          type: string
        in: query
        name: documentIds
        required: true
        description: 'Comma-separated list of document IDs to download. Single ID returns PDF, multiple
          IDs return ZIP. Example: "123,456,789"'
      - schema:
          type: integer
          minimum: 1
        in: path
        name: fileId
        required: true
        description: The id of the file to download documents from.
      responses:
        '200':
          description: Document file - PDF for single document, ZIP for multiple documents
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/zip:
              schema:
                type: string
                format: binary
        default:
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - errors
                - traceId
                properties:
                  code:
                    type: string
                    description: A code that represents the error that occurred.
                  message:
                    type: string
                    description: A description of the error that occurred.
                  errors:
                    type: array
                    items:
                      type: string
                    description: An array of the errors that occurred.
                  traceId:
                    type: string
                    description: A request correlation ID.
  /files/{fileId}/documents/upload:
    post:
      summary: Upload Document to File
      tags:
      - Files
      - Documents
      description: 'Upload a PDF document to a file. Max size 25MB. Accepts multipart/form-data with fields:
        DocumentName (string), DocumentBody (binary PDF file), IsSignedDocument (true/false, optional).<div
