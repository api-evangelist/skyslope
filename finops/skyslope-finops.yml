description: >-
  FinOps view of SkySlope spend. SkySlope is a subscription SaaS billed
  primarily per user/seat on tiered plans (Essentials, Professional,
  Enterprise), with quote-based pricing that varies by brokerage size and
  transaction volume. Incremental costs come from add-ons such as SMS signer
  notifications, identity verification, regional compliance features, and
  one-time data migration/training. API access (Partnership / Forms API, Offers
  API, Transaction Management API BETA) is bundled into the partner/brokerage
  relationship rather than billed as a separate metered API line item.
notes: >-
  Per-user rates and add-on unit costs are third-party estimates and are not
  reconciled here; verify with SkySlope sales. The dominant cost driver is
  seat count across the brokerage plus consumption add-ons.
