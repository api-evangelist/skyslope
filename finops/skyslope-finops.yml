meters:
- name: seats
  description: Active user/agent seats subscribed on a plan tier, the primary billing driver.
  unit: seats
  aggregation: max
  dimensions:
  - account
  - plan
  - office
- name: sms_notifications
  description: SMS signer notifications, billed per message as an add-on.
  unit: messages
  aggregation: sum
  dimensions:
  - account
- name: identity_verifications
  description: Signer identity verifications, billed per verification as an add-on.
  unit: verifications
  aggregation: sum
  dimensions:
  - account
- name: onboarding
  description: One-time data migration and training fees.
  unit: engagements
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track seat counts per office/team and add-on consumption (SMS, identity verification) against the plan.
- name: Allocation
  description: Map seats and add-ons to offices/teams so cost lands on the right cost center within the brokerage.
- name: Optimization
  description: Right-size seats to active agents, choose the plan tier matching transaction volume and envelope needs, and control per-message/per-verification add-ons.
- name: Accountability
  description: Assign an owner for the SkySlope contract; review seat utilization and add-on spend against budget each billing cycle.
