name: SkySlope
kind: company
description: SkySlope is a real estate transaction management and digital forms
  platform used by brokerages, teams, and agents across the U.S. and Canada to
  store, manage, and audit transaction documents for compliance, prepare and
  e-sign forms, and manage offers. SkySlope exposes a partner-oriented public API
  program - a Partnership / Forms API (OAuth 2.0 authorization-code flow with PKCE)
  for creating and managing listing and transaction files, documents, contacts,
  envelopes, forms libraries, and templates; an Offers API (OAuth 2.0
  client-credentials flow) for retrieving listings, offers, and offer/listing
  analytics from SkySlope Offers; and a broader Transaction Management API (BETA)
  positioned for brokerages to query and extract their SkySlope data for
  reporting and enterprise integration. API access is partner/brokerage-gated -
  reference documentation is public but obtaining OAuth client credentials
  requires working with SkySlope.
